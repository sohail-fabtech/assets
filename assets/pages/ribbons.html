<!doctype html><html data-theme="graphite"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Pulse – Ribbons &amp; result banners</title>
<link rel="stylesheet" href="../motion/themes.css">
<link rel="stylesheet" href="../motion/anim.css">
<link rel="stylesheet" href="../motion/chrome.css">
<style>
body{margin:0;min-height:100vh;color:#fff;font:600 14px/1.45 Poppins,sans-serif;background:radial-gradient(100% 60% at 50% 0,#4a2a8a,#1a0e3a 70%)}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;background:#1a0e3ae6;backdrop-filter:blur(10px)}
.chip{border:1px solid #ffffff2a;background:#ffffff10;color:#fff;border-radius:99px;padding:5px 11px;cursor:pointer;font:700 12px Poppins;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:#fff;color:#1a0e3a}.chip i{width:11px;height:11px;border-radius:50%}
main{padding:10px 26px 60px;max-width:1280px;margin:0 auto}
h2{font:900 26px/1.2 Poppins;margin:40px 0 4px}h2+p{margin:0 0 22px;opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:30px;align-items:center}
.rb{position:relative;display:inline-block}.rb>img{display:block;width:100%}
.rb svg.lab{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lab text{font:900 46px Poppins;fill:#fff;stroke:var(--ink,#1e0a4a);stroke-width:10px;paint-order:stroke;stroke-linejoin:round;letter-spacing:.02em}
.lab text.gold{fill:url(#goldtxt)}
.cmp{position:relative;cursor:pointer}.cmp:active{transform:scale(.97)}
.abs{position:absolute}
.g3{font:900 50px/1 Poppins}
.num{position:absolute;inset:0;display:grid;place-items:center;font:900 54px Poppins;color:#fff;-webkit-text-stroke:9px #8a4000;paint-order:stroke fill;padding-top:14px}
.bar{display:flex;align-items:center;gap:0;width:420px}
.bar .cap{width:76px;z-index:2;margin-right:-26px;filter:drop-shadow(0 4px 0 #0005)}
.bar .track{flex:1}.bar .plus{width:46px;margin-left:-14px;z-index:2;cursor:pointer}
.bar .pct{position:absolute;inset:0;display:grid;place-items:center;font:900 16px Poppins;-webkit-text-stroke:4px #5a1a00;paint-order:stroke fill;z-index:3}
.sparkle{position:absolute;width:26px;animation:tw 1.8s ease-in-out infinite}.sparkle:nth-of-type(2n){animation-delay:.6s}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.cmp{cursor:pointer}
/* reveal choreography — only scale/rotate/opacity (elements already use translate for centring) */
.reveal .rv-ribbon{animation:rv-unfurl 420ms cubic-bezier(.34,1.4,.64,1) var(--d,0ms) both}
.reveal .rv-laurel{animation:rv-grow 460ms cubic-bezier(.34,1.4,.64,1) var(--d,0ms) both;transform-origin:50% 100%}
.reveal .rv-star{animation:rv-star 520ms cubic-bezier(.34,1.5,.64,1) both, rv-bob 2.4s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 600ms)}
.reveal .rv-title{animation:rv-punch 460ms cubic-bezier(.34,1.4,.64,1) both, rv-glow 2.2s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 500ms)}
.reveal .rv-pop{animation:rv-punch 420ms cubic-bezier(.34,1.4,.64,1) var(--d,0ms) both}
.reveal .rv-fade{animation:rv-fade 600ms ease-out var(--d,0ms) both}
@keyframes rv-unfurl{0%{scale:0 .6;opacity:0}70%{scale:1.05 1;opacity:1}100%{scale:1}}
@keyframes rv-grow{0%{scale:.2;opacity:0;rotate:-25deg}100%{scale:1;opacity:1;rotate:0deg}}
@keyframes rv-star{0%{scale:0;rotate:-160deg;opacity:0}65%{scale:1.3;rotate:12deg;opacity:1}85%{scale:.92;rotate:-4deg}100%{scale:1;rotate:0deg}}
@keyframes rv-bob{50%{rotate:5deg;scale:1.04}}
@keyframes rv-punch{0%{scale:2.4;opacity:0}60%{scale:.9;opacity:1}100%{scale:1}}
@keyframes rv-glow{50%{filter:brightness(1.18) drop-shadow(0 0 10px #ffd65a88)}}
@keyframes rv-fade{from{opacity:0}to{opacity:1}}
/* in-game preview overlay */
#stage{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:radial-gradient(#2a1a6acc,#05020ef2);backdrop-filter:blur(4px);cursor:pointer}
#stage.on{display:grid}#stage .hold{scale:1.25;pointer-events:none}#stage small{position:absolute;bottom:30px;opacity:.6}
.ctrls{display:flex;gap:10px;margin:18px 0 0}.ctrls button{font:800 13px Poppins;color:#fff;background:#ffffff14;border:1px solid #ffffff2a;border-radius:99px;padding:8px 16px;cursor:pointer}
.ctrls button.go{background:#ffa51f;color:#2a1200;border:0}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c0"/><stop offset=".5" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff8a1a"/></linearGradient></defs></svg>
<header id="chips"></header><main id="main"></main><div id="stage"><div class="hold" id="hold"></div><small>Tap anywhere to close</small></div><canvas id="fx"></canvas>
<script type="module">
import * as A from '../motion/anim.js';
const $ = s => document.querySelector(s), fx = A.particles($('#fx'));
const C = await (await fetch('../data/chrome.json')).json(), K = await (await fetch('../data/ui-kit.json')).json();
let theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('edgepulse.theme') || 'graphite';
const SH = k => `../ui/chrome/shared/chr_shared_${k}.svg`;
const VB = { curved: '0 0 600 230', wave: '0 0 600 240' };
let uid = 0;
/** Ribbon with its label laid along the ribbon's own arc (textPath), like the reference banners. */
function arc(kind, tone, text, w = 420, gold = false, size = 46) {
  const id = `a${uid++}`, ink = '#2a0a3a';
  return `<div class="rb" style="width:${w}px;--ink:${ink}"><img src="../${C.tones[tone][kind]}" alt="">
    <svg class="lab" viewBox="${VB[kind]}"><path id="${id}" d="${C.arcs[kind]}" fill="none"/>
    <text class="${gold ? 'gold' : ''}" style="font-size:${size}px" text-anchor="middle" dy=".36em"><textPath href="#${id}" startOffset="50%">${text}</textPath></text></svg></div>`;
}
const star = (w, face = false, cls = 's') => `<img class="${cls}" src="${SH(face ? 'star-face' : 'star-gold')}" width="${w}" alt="">`;
const laurels = (h, col = 'gold', gap = 0) => [`<img class="abs" src="${SH('laurel-' + col)}" style="height:${h}px;left:${-gap}px;bottom:0" alt="">`,
  `<img class="abs" src="${SH('laurel-' + col)}" style="height:${h}px;right:${-gap}px;bottom:0;transform:scaleX(-1)" alt="">`].join('');
const sparkles = pts => pts.map(([x, y, s = 26]) => `<img class="sparkle" src="${SH('sparkle')}" style="left:${x}%;top:${y}%;width:${s}px" alt="">`).join('');

function render() {
  const tone = C.tones[theme] ? theme : 'brand', P = K.themes[theme].palette;
  document.documentElement.dataset.theme = theme;
  $('#chips').innerHTML = Object.entries(K.themes).map(([id, t]) => `<button class="chip" data-t="${id}" aria-pressed="${id === theme}"><i style="background:${t.palette.primary}"></i>${t.name}</button>`).join('');
  const tones = Object.keys(C.tones);
  $('#main').innerHTML = `
  <div class="ctrls"><button class="go" id="ingame">▶ Show in game</button><button id="auto">Auto-replay: on</button><button id="all">Replay all</button></div>
  <h2>Ribbon shapes</h2><p>Curved, wave and bow — every theme colour. Labels follow the ribbon's arc.</p>
  <div class="row">${arc('curved', tone, 'LEVEL UP', 380)}${arc('wave', tone, 'BONUS', 380)}<div class="rb" style="width:200px"><img src="../${C.tones[tone].bow}" alt=""></div></div>
  <div class="row" style="margin-top:18px">${tones.map(t => arc('curved', t, t === 'brand' ? 'EDGE PULSE' : K.themes[t].name.split(' ').pop().toUpperCase(), 230, false, 50)).join('')}</div>

  <h2>Level up badges</h2><p>Star with the new level, ribbon, laurels. Tap one to replay its entrance.</p>
  <div class="row">
    <div class="cmp pop" style="width:280px;height:250px">${laurels(200, 'gold', -8)}<div class="abs s" style="left:50%;top:0;translate:-50% 0;width:170px">${star(170, false, '')}<div class="num">10</div></div>
      <div class="abs" style="left:50%;bottom:12px;translate:-50% 0">${arc('curved', tone, 'LEVEL UP', 270, false, 52)}</div></div>
    <div class="cmp pop" style="width:300px;height:250px"><div class="abs" style="left:50%;top:20px;translate:-50% 0;display:flex;align-items:flex-end">${star(70)}<div class="s" style="position:relative">${star(120, false, '')}<div class="num" style="font-size:40px">10</div></div>${star(70)}</div>
      <div class="abs" style="left:50%;bottom:10px;translate:-50% 0">${arc('wave', tone, 'LEVEL UP', 300, true, 54)}</div></div>
    <div class="cmp pop" style="width:300px;height:230px"><div class="abs" style="left:50%;top:6px;translate:-50% 0;display:flex;align-items:flex-end;gap:2px">${star(86, true)}${star(112, true)}${star(86, true)}</div>
      <div class="abs pill" style="left:50%;bottom:12px;translate:-50% 0;width:260px;--pill-src:url(../${C.tones[tone].pill})"><span class="label-3d" data-text="LEVEL UP" style="font:900 26px Poppins">LEVEL UP</span></div></div>
    <div class="cmp pop" style="width:240px;height:240px"><div class="abs" style="left:50%;top:0;translate:-50% 0;display:flex;gap:4px">${star(52)}${star(62)}${star(52)}</div>
      <div class="abs s" style="left:50%;top:52px;translate:-50% 0;width:124px"><img src="../${C.tones[tone].socket}" width="124" alt=""><div class="num" style="font-size:46px;padding:0;-webkit-text-stroke-color:#1e0a4a">10</div></div>
      <div class="abs" style="left:50%;bottom:6px;translate:-50% 0">${arc('curved', tone, 'LEVEL UP', 250, false, 52)}</div></div>
  </div>

  <h2>Level completed</h2><p>Big curved ribbon carrying three stars, laurels and gold lettering.</p>
  <div class="row"><div class="cmp pop" style="width:640px;height:264px">${sparkles([[18, 18], [80, 14, 20], [30, 72, 18], [72, 70, 22]])}
    <div class="abs" style="left:50%;top:10px;translate:-50% 0">${arc('curved', tone, '', 600)}</div>
    <div class="abs" style="inset:0 0 auto 0;height:206px">${laurels(176, 'gold', 6)}</div>
    <div class="abs" style="left:50%;top:30px;translate:-50% 0;display:flex;gap:6px;align-items:flex-end">${star(120)}${star(140)}${star(120)}</div>
    <div class="abs" style="left:50%;top:196px;translate:-50% 0;text-align:center"><span class="title-3d gold-3d g3" data-text="LEVEL COMPLETED" style="font-size:40px">LEVEL COMPLETED</span></div></div></div>

  <h2>Victory banners</h2><p>Five variants: ribbon, stone plaque, winged trophy crest, laurel crest, pill burst.</p>
  <div class="row">
    <div class="cmp pop" style="width:420px;height:210px"><div class="abs" style="left:50%;top:0;translate:-50% 0;display:flex;align-items:flex-end">${star(70)}${star(92)}${star(70)}</div>
      <div class="abs" style="left:50%;bottom:0;translate:-50% 0">${arc('curved', tone, 'VICTORY', 420, true, 60)}</div></div>
    <div class="cmp pop" style="width:400px;height:220px"><div class="abs" style="left:50%;top:0;translate:-50% 0;display:flex;align-items:flex-end;z-index:2">${star(66)}${star(84)}${star(66)}</div>
      <div class="abs" style="left:50%;bottom:0;translate:-50% 0;width:380px"><img src="${SH('plaque')}" width="380" alt=""><div class="abs" style="inset:0;display:grid;place-items:center;font:900 46px Poppins;color:#5a606c;text-shadow:0 -2px 0 #2a2d33,0 2px 0 #e8ecf2">VICTORY</div></div></div>
    <div class="cmp pop" style="width:440px;height:260px"><img class="abs" src="${SH('wing')}" style="left:40px;top:8px;height:170px" alt=""><img class="abs" src="${SH('wing')}" style="right:40px;top:8px;height:170px;transform:scaleX(-1)" alt="">
      <img class="abs s" src="${SH('trophy')}" style="left:50%;top:0;translate:-50% 0;height:110px" alt="">
      <div class="abs pill" style="left:50%;top:110px;translate:-50% 0;width:330px;--pill-src:url(../${C.tones.brand.pill})"><span class="label-3d" data-text="LEVEL COMPLETED" style="font:900 26px Poppins">LEVEL COMPLETED</span></div>
      <div class="abs" style="left:50%;bottom:0;translate:-50% 0;display:flex;align-items:flex-end">${star(56)}${star(70)}${star(56)}</div></div>
    <div class="cmp pop" style="width:420px;height:230px">${laurels(170, 'green', 10)}<div class="abs" style="left:50%;top:0;translate:-50% 0;display:flex;align-items:flex-end">${star(66)}${star(86)}${star(66)}</div>
      <div class="abs" style="left:50%;bottom:6px;translate:-50% 0">${arc('curved', 'volcano', 'VICTORY!', 400, false, 58)}</div></div>
    <div class="cmp pop" style="width:400px;height:220px"><img class="abs" src="${SH('rays')}" style="left:50%;top:50%;width:360px;translate:-50% -50%;animation:spin 14s linear infinite" alt="">
      <div class="abs" style="left:50%;top:0;translate:-50% 0;display:flex;align-items:flex-end">${star(66)}${star(86)}${star(66)}</div>
      <div class="abs" style="left:50%;bottom:6px;translate:-50% 0">${arc('wave', 'nebula', 'VICTORY', 400, true, 60)}</div></div>
  </div>

  <h2>Icon progress bars</h2><p>Icon cap · track · glossy fill · percentage · plus button. Tap + to fill.</p>
  <div style="display:grid;gap:18px">
    ${[['../hud/life_heart.svg', .8, 'fill-orange'], ['../ui/chrome/shared/chr_shared_reward-coin.svg', .8, null], ['../hud/shard.svg', .6, null], ['../ui/chrome/shared/chr_shared_star-gold.svg', .35, 'fill-orange'], ['../hud/life_potion.svg', .15, null]].map(([ic, p, f], i) =>
      `<div class="bar"><img class="cap" src="${ic}" alt=""><div class="track" style="position:relative"><div class="fill" style="width:${p * 100}%;${f ? '' : `--fill-src:url(../${C.tones[tone].fill})`}"></div><span class="pct">${Math.round(p * 100)}%</span></div><img class="plus" src="${SH('plus')}" data-i="${i}" alt="Add"></div>`).join('')}
  </div>`;
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip) { theme = chip.dataset.t; localStorage.setItem('edgepulse.theme', theme); render(); return boot(); }
  const plus = e.target.closest('.plus');
  if (plus) { const bar = plus.parentElement, f = bar.querySelector('.fill'), pct = bar.querySelector('.pct');
    const v = Math.min(100, parseFloat(f.style.width) + 10); f.style.width = v + '%'; pct.textContent = Math.round(v) + '%'; A.play(plus, 'pop');
    if (v >= 100) fx.burst(bar, 20, ['#ffd65a', '#fff', '#ff9a1a']); return; }
  if (e.target.id === 'ingame') return showInGame();
  if (e.target.id === 'all') return document.querySelectorAll('main .cmp').forEach((c, i) => setTimeout(() => reveal(c), i * 140));
  if (e.target.id === 'auto') { auto = !auto; e.target.textContent = `Auto-replay: ${auto ? 'on' : 'off'}`; return; }
  if (e.target.closest('#stage')) return $('#stage').classList.remove('on');
  const c = e.target.closest('.cmp'); if (c) reveal(c);
});
/** Fit every ribbon label to its band: shrink until it spans ≤ 70% of the centre line (keeps clear of the folds). */
function fitLabels() {
  document.querySelectorAll('svg.lab').forEach(svg => {
    const path = svg.querySelector('path'), text = svg.querySelector('text');
    if (!text.textContent.trim()) return;
    const max = path.getTotalLength() * .7;
    let size = parseFloat(text.style.fontSize);
    while (text.getComputedTextLength() > max && size > 14) { size -= 1; text.style.fontSize = size + 'px'; }
  });
}
addEventListener('message', e => { if (e.data?.type === 'theme' && K.themes[e.data.theme]) { theme = e.data.theme; render(); boot(); } });
/** Tag each part of a composition with its reveal role + delay: ribbon → laurels/wings → stars one by one → title. */
function tag(c) {
  const all = [...c.querySelectorAll('*')], has = (el, k) => (el.getAttribute?.('src') || '').includes(k);
  let t = 0; const set = (el, cls, d) => { el.classList.add(cls); el.style.setProperty('--d', d + 'ms'); };
  all.filter(el => el.classList.contains('rb') || el.classList.contains('pill') || (el.tagName === 'IMG' && has(el, 'plaque'))).forEach(el => set(el, 'rv-ribbon', 0));
  all.filter(el => el.tagName === 'IMG' && (has(el, 'laurel') || has(el, 'wing'))).forEach(el => set(el, 'rv-laurel', 140));
  all.filter(el => el.tagName === 'IMG' && (has(el, 'rays') || has(el, 'sparkle'))).forEach(el => set(el, 'rv-fade', 200));
  all.filter(el => el.tagName === 'IMG' && has(el, 'trophy')).forEach(el => set(el, 'rv-pop', 220));
  const stars = all.filter(el => el.tagName === 'IMG' && /star-(gold|face)/.test(el.getAttribute('src'))).map(el => el.parentElement.classList.contains('s') ? el.parentElement : el);
  stars.forEach((el, i) => set(el, 'rv-star', (t = 320 + i * 170)));
  all.filter(el => el.classList.contains('title-3d') || (el.classList.contains('label-3d') && !el.closest('.rb'))).forEach(el => set(el, 'rv-title', t + 260));
  return stars;
}
function reveal(c) {
  const stars = tag(c);
  c.classList.remove('reveal'); void c.offsetWidth; c.classList.add('reveal');
  stars.forEach(st => setTimeout(() => fx.burst(st, 12, ['#ffd65a', '#fff6c0', '#fff']), parseFloat(st.style.getPropertyValue('--d')) + 330));
}
function showInGame() {
  const src = document.querySelectorAll('main .cmp')[4];  // the Level Completed banner
  $('#hold').innerHTML = src.outerHTML; $('#stage').classList.add('on');
  const c = $('#hold .cmp'); fitLabels(); reveal(c);
  setTimeout(() => { for (let i = 0; i < 4; i++) setTimeout(() => fx.burst(c, 36, ['#ffd65a', '#ff7ad9', '#7ff3ff', '#9dff6a', '#fff']), i * 220); }, 900);  // confetti
}
let auto = true, turn = 0;
setInterval(() => { if (!auto || $('#stage').classList.contains('on')) return;
  const cs = [...document.querySelectorAll('main .cmp')]; if (cs.length) reveal(cs[turn++ % cs.length]); }, 1600);   // a different banner replays every 1.6 s
function boot() { fitLabels(); document.querySelectorAll('main .cmp').forEach((c, i) => setTimeout(() => reveal(c), 200 + i * 160)); }
render(); document.fonts.ready.then(boot);
</script></body></html>

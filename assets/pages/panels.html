<!doctype html><html data-theme="graphite"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Pulse – Panels &amp; banners</title>
<link rel="stylesheet" href="../motion/themes.css">
<link rel="stylesheet" href="../motion/anim.css">
<link rel="stylesheet" href="../motion/chrome.css">
<style>
:root{--brand-font:"Poppins",system-ui,sans-serif}
body{margin:0;min-height:100vh;color:#fff;font:600 14px/1.45 Poppins,sans-serif;background:radial-gradient(100% 60% at 50% 0,#4a3aa8,#160e40 70%)}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;background:#160e40e6;backdrop-filter:blur(10px)}
.chip{border:1px solid #ffffff2a;background:#ffffff10;color:#fff;border-radius:99px;padding:5px 11px;cursor:pointer;font:700 12px Poppins;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:#fff;color:#160e40}.chip i{width:11px;height:11px;border-radius:50%}
main{padding:10px 26px 60px;max-width:1280px;margin:0 auto}
h2{font:900 26px/1.2 var(--brand-font);margin:40px 0 4px}h2+p{margin:0 0 30px;opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:34px 26px;align-items:flex-start}
/* --- panel anatomy: socket icon above · header/ribbon title · description · body · actions --- */
.panel{position:relative;width:330px;padding-top:44px}
.panel .frame{border-width:24px;border-image-width:24px;padding:58px 8px 8px;text-align:center}
.panel .sock{position:absolute;left:50%;top:-6px;width:96px;translate:-50% 0;z-index:3}.panel .sock>img{width:100%}
.panel .sock .ic{position:absolute;inset:16%;width:68%}
.panel .ttl{position:absolute;left:50%;top:76px;translate:-50% 0;width:96%;z-index:2}
.panel .ttl .ribbon{height:76px;border-width:0 48px;border-image-width:0 48px;padding-bottom:10px}
.t3{font:900 24px/1.05 var(--brand-font)}.t3s{font:900 18px/1.05 var(--brand-font)}
.desc{font:600 14px/1.45 Poppins;opacity:.9;margin:10px 6px 14px}
.acts{display:flex;gap:10px;justify-content:center;margin-top:6px}
.btn{position:relative;width:140px;cursor:pointer;transition:transform 120ms}.btn:active{transform:translateY(3px) scale(.96)}
.btn img{width:100%;display:block}.btn span{position:absolute;inset:0 0 12%;display:grid;place-items:center;font:900 19px var(--brand-font);color:var(--lc,#fff);text-shadow:0 2px 0 #0004}
.hdr{border-style:solid;border-color:transparent;border-width:0 40px;border-image:var(--header-src) 0 60 fill / 0 40px stretch;height:62px;display:grid;place-items:center;box-sizing:border-box;margin:-8px -8px 10px}
.stars{display:flex;justify-content:center;gap:4px;margin:4px 0}.stars img{width:62px}.stars img:nth-child(2){width:82px;margin-top:-16px}
.score{font:900 40px var(--brand-font);font-variant-numeric:tabular-nums}
.rays{position:absolute;left:50%;top:40%;width:360px;translate:-50% -50%;animation:spin 14s linear infinite;pointer-events:none;opacity:.9}
.hero{position:relative;width:150px;margin:0 auto}
/* shop card */
.offer{position:relative;width:250px}.offer .frame{border-width:20px;border-image-width:20px;text-align:center;padding:8px 4px 6px;overflow:hidden}
.offer .corner{position:absolute;right:-6px;top:-6px;width:120px;z-index:3}.offer .corner b{position:absolute;right:-4px;top:30px;rotate:45deg;font:900 13px var(--brand-font);width:110px;text-align:center;color:#fff;text-shadow:0 1px 0 #0006}
.offer .burst{position:absolute;left:-14px;top:-16px;width:84px;z-index:3;animation:wob 2.4s ease-in-out infinite}.offer .burst b{position:absolute;inset:0;display:grid;place-items:center;font:900 22px var(--brand-font);rotate:-10deg}
@keyframes wob{50%{rotate:8deg;scale:1.06}}
.old{text-decoration:line-through;opacity:.6;font-size:13px}
/* daily */
.days{display:grid;grid-template-columns:repeat(7,104px);gap:12px}
.day{position:relative}.day .frame{border-width:14px;border-image-width:14px;text-align:center;padding:4px 0 6px}
.day img.r{width:54px}.day small{display:block;font:800 12px Poppins;opacity:.85}.day.claimed{opacity:.55}.day.today{animation:breathe 1.6s ease-in-out infinite}
.day .ok{position:absolute;right:-6px;top:-6px;width:34px}
/* quests */
.quest{display:grid;grid-template-columns:80px 1fr 150px;gap:14px;align-items:center;width:640px}.quest.frame{border-width:16px;border-image-width:16px}
.quest .sock2{position:relative;width:80px}.quest .sock2 img{width:100%}.quest .sock2 .ic{position:absolute;inset:16%;width:68%}
.quest b{font:900 20px var(--brand-font)}.quest p{margin:0 0 6px;opacity:.8;font-size:13px}.quest .track{width:100%}
/* toast / achievement */
.toast{display:flex;align-items:center;gap:12px;width:460px;padding:6px 14px 6px 6px;border-radius:99px;background:linear-gradient(#2a1a6a,#140a3a);box-shadow:inset 0 0 0 3px #ffd65a,0 10px 30px #0008}
.toast img{width:64px}.toast small{display:block;font:800 11px Poppins;letter-spacing:.08em;color:#ffd65a}.toast b{font:900 22px var(--brand-font)}
/* event banner */
.event{position:relative;width:700px;height:210px}.event.frame{border-width:22px;border-image-width:22px}
.event .bg{position:absolute;inset:-6px;border-radius:14px;background-size:cover;background-position:center 30%}
.event .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000a,transparent 70%);border-radius:14px}
.event .txt{position:absolute;left:24px;top:22px}.event .txt p{margin:4px 0 12px;max-width:320px}
.event .live{position:absolute;right:30px;top:-18px;width:66px}.event .live b{position:absolute;inset:16px 0 0;text-align:center;font:900 16px var(--brand-font)}
.timer{display:inline-flex;align-items:center;gap:8px;font:800 16px Poppins;font-variant-numeric:tabular-nums}
/* callout */
.callout{position:relative;width:330px}.callout .bub{border-style:solid;border-color:transparent;border-width:30px;border-image:url(../ui/chrome/shared/chr_shared_bubble.svg) 34 fill / 30px stretch;color:#3a1a00;font:700 15px Poppins;padding:0}
.callout .tl{position:absolute;left:60px;bottom:-28px;width:46px}.callout .mascot{position:absolute;left:-10px;bottom:-110px;width:96px}
.callout b{display:block;font:900 21px var(--brand-font);color:#7a2a00}
/* settings + leaderboard */
.list .frame{border-width:22px;border-image-width:22px;padding:0 6px 8px}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-bottom:1px solid #ffffff14}.li:last-child{border:0}
.li img.i{width:46px}.li .tg{width:74px;cursor:pointer}
.rank{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:900 20px var(--brand-font);box-shadow:inset 0 -4px 0 #0004,0 0 0 3px #0005}
.lb .li{grid-template-columns:48px 44px 1fr auto}.lb .li img.a{width:44px}.lb .me{background:#ffffff14;border-radius:14px}
/* banners strip */
.strip{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.tagx{position:relative;width:62px}.tagx img{width:100%}.tagx b{position:absolute;inset:10px 0 0;text-align:center;font:900 15px/1.1 var(--brand-font)}
.lvl{position:relative;width:640px;height:120px;display:grid;place-items:center}
.lvl .band{position:absolute;inset:18px 0;background:linear-gradient(90deg,transparent,#000a 15%,#000a 85%,transparent)}
.lvl.anim .t3{animation:fx-pop 600ms cubic-bezier(.34,1.4,.64,1)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
</style></head><body>
<header id="chips"></header>
<main id="main"></main><canvas id="fx"></canvas>
<script type="module">
import * as A from '../motion/anim.js';
const $ = s => document.querySelector(s), fx = A.particles($('#fx'));
const C = await (await fetch('../data/chrome.json')).json(), L = await (await fetch('../data/levels.json')).json(), K = await (await fetch('../data/ui-kit.json')).json();
let theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('edgepulse.theme') || 'graphite';
const T3 = (txt, cls = 't3', gold = false) => `<span class="title-3d ${cls} ${gold ? 'gold-3d' : ''}" data-text="${txt}">${txt}</span>`;
const L3 = (txt, cls = 't3s') => `<span class="label-3d ${cls}" data-text="${txt}">${txt}</span>`;
const SH = k => `../ui/chrome/shared/chr_shared_${k}.svg`;

function render() {
  const tone = C.tones[theme] ? theme : 'brand', ch = C.tones[tone], P = K.themes[theme].palette, lv = L[theme];
  const ui = (c, s = 'normal') => `../buttons/${theme}/ui_${theme}_${c}_${s}.svg`;
  const btn = (label, role = 'primary', fx = 'tap') => `<div class="btn" data-fx="${fx}" style="--lc:${role === 'primary' ? P.onPrimary : role === 'danger' ? P.onDanger : P.onSecondary}"><img src="${ui('pill-' + role)}" alt=""><span>${label}</span></div>`;
  const goal = lv.collectibles.find(c => c.id === lv.goal.item) || lv.collectibles[0];
  const sock = (icon) => `<div class="sock"><img src="../${ch.socket}" alt=""><img class="ic" src="${icon}" alt=""></div>`;
  const panel = (icon, title, body, w = 330) => `<div class="panel" style="width:${w}px">${sock(icon)}<div class="ttl"><div class="ribbon">${L3(title, 't3')}</div></div><div class="frame">${body}</div></div>`;
  document.documentElement.dataset.theme = theme;
  const r = document.documentElement.style;
  r.setProperty('--frame-src', `url(../${ch.frame})`); r.setProperty('--ribbon-src', `url(../${ch.ribbon})`);
  r.setProperty('--pill-src', `url(../${ch.pill})`); r.setProperty('--header-src', `url(../${ch.header})`); r.setProperty('--fill-src', `url(../${ch.fill})`);
  $('#chips').innerHTML = Object.entries(K.themes).map(([id, t]) => `<button class="chip" data-t="${id}" aria-pressed="${id === theme}"><i style="background:${t.palette.primary}"></i>${t.name}</button>`).join('');
  $('#main').innerHTML = `
  <h2>Dialogs</h2><p>Icon socket above · ribbon title · description · actions. The base pattern every pop-up uses.</p>
  <div class="row">
    ${panel(ui('icon-close'), 'Quit level?', `<div class="desc">You'll lose this run's progress and one life.</div><div class="acts">${btn('Stay', 'secondary')}${btn('Quit', 'danger')}</div>`)}
    ${panel(ui('icon-settings'), 'New rule!', `<div class="desc">${lv.obstacles[0].name}s block your shots. Make ${lv.obstacles[0].hits} clear${lv.obstacles[0].hits > 1 ? 's' : ''} next to one to break it.</div><img src="../${lv.obstacles[0].states[0]}" width="84" alt=""><div class="acts">${btn('Got it')}</div>`)}
    ${panel('../hud/life_heart.svg', 'Out of lives', `<div class="desc">Lives refill every 20 minutes — or watch a short tip to get one now.</div><div class="timer" style="justify-content:center;width:100%">⏱ 18:42</div><div class="acts" style="margin-top:12px">${btn('Refill', 'primary')}</div>`)}
  </div>
  <h2>Rewards &amp; results</h2><p>Rotating rays, staggered stars, rolling numbers, glowing claim button.</p>
  <div class="row">
    <div class="panel" style="width:330px"><div class="ttl" style="top:6px"><div class="ribbon">${L3('Reward!')}</div></div>
      <div class="frame" style="padding-top:60px;overflow:hidden;position:relative"><img class="rays" src="${SH('rays')}" alt=""><img class="hero" src="${SH('chest')}" alt="">
      <div class="desc" style="position:relative">${T3('+250', 't3', true)}<br>Pulse Shards</div><div class="acts" style="position:relative">${btn('Claim', 'primary', 'claim')}</div></div></div>
    <div class="panel" style="width:340px"><div class="ttl" style="top:6px"><div class="ribbon">${L3('Level 12')}</div></div>
      <div class="frame" style="padding-top:62px"><div class="stars" id="stars"><img src="../hud/star_on.svg"><img src="../hud/star_on.svg"><img src="../hud/star_off.svg"></div>
      <div class="score" id="score">0</div><div class="desc" style="margin-top:0">Best streak ×4 · 2 crates broken</div><div class="acts">${btn('Retry', 'secondary')}${btn('Next', 'primary', 'replay')}</div></div></div>
    <div class="panel" style="width:330px;filter:saturate(.75)"><div class="ttl" style="top:6px"><div class="ribbon" style="--ribbon-src:url(../${C.tones.brand.ribbon})">${L3('Out of moves')}</div></div>
      <div class="frame" style="padding-top:62px"><img src="../hud/life_potion.svg" width="96" alt="" style="filter:grayscale(.6)"><div class="desc">So close! You needed 3 more ${goal.name.toLowerCase()}s.</div><div class="acts">${btn('+5 moves', 'secondary')}${btn('Retry', 'primary')}</div></div></div>
  </div>
  <h2>Shop offers</h2><p>Corner ribbon, starburst discount, hero item, struck-through old price.</p>
  <div class="row">
    ${[['Starter Pack', 'BEST VALUE', '-50%', goal.hero, '2.99', '5.99'], ['Booster Bundle', 'POPULAR', 'x2', ui('booster'), '1.99', ''], ['World Pass', 'NEW', '', '../' + lv.scene, '4.99', '']].map(([t, c, b, img, p, o], i) =>
      `<div class="offer">${c ? `<div class="corner"><img src="../${ch.corner}" width="120" alt=""><b>${c}</b></div>` : ''}${b ? `<div class="burst"><img src="../${C.tones.volcano.burst}" width="84" alt=""><b>${L3(b)}</b></div>` : ''}
       <div class="frame"><div class="hdr" style="margin-bottom:4px">${L3(t)}</div>${i === 2 ? `<div style="height:150px;border-radius:12px;background:url(${img}) center/cover"></div>` : `<img src="${i === 0 ? '../' + img : img}" width="150" alt="">`}
       <div class="desc" style="margin:6px">${i === 0 ? '10 boosters · 500 shards · 3 lives' : i === 1 ? 'Double boosters for 24 h' : 'Unlock all world rewards'}</div>
       ${o ? `<div class="old">was ${o}</div>` : '<div class="old">&nbsp;</div>'}<div class="btn" style="width:190px;margin:0 auto" data-fx="tap"><img src="${ui('price')}" alt=""><span style="padding-left:40px;color:${P.onSecondary}">${p}</span></div></div></div>`).join('')}
  </div>
  <h2>Daily rewards</h2><p>Claimed (dimmed + check), today (breathing), upcoming. Day 7 is the big one.</p>
  <div class="days">${[1, 2, 3, 4, 5, 6, 7].map(d => `<div class="day ${d < 3 ? 'claimed' : d === 3 ? 'today' : ''}"><div class="frame"><small>Day ${d}</small>
     <img class="r" src="${d === 7 ? SH('chest') : d % 3 === 0 ? SH('reward-orb') : d % 2 ? SH('reward-coin') : '../hud/shard.svg'}" alt=""><small>${d === 7 ? 'Chest' : d % 3 === 0 ? '1 orb' : (d * 25) + ' ✦'}</small></div>
     ${d < 3 ? `<img class="ok" src="${ui('checkbox', 'on')}" alt="">` : ''}</div>`).join('')}</div>
  <h2>Quests</h2><p>Icon socket · title · description · progress · claim.</p>
  <div style="display:grid;gap:16px">
    ${[['Pulse Hunter', 'Clear 30 pieces in one run', .7, goal.file, 'claim'], ['Crate Breaker', 'Break 5 crates', 1, lv.obstacles[0].states[0], 'ready'], ['Streak Star', 'Reach a ×3 streak', .2, 'hud/star_on.svg', 'go']].map(([t, d, pct, ic, st]) =>
      `<div class="quest frame"><div class="sock2"><img src="../${ch.socket}" alt=""><img class="ic" src="../${ic}" alt=""></div>
       <div><b>${t}</b><p>${d}</p><div class="track"><div class="fill" style="width:${pct * 100}%"></div></div></div>
       ${st === 'ready' ? btn('Claim', 'primary', 'claim') : `<div class="btn" style="filter:grayscale(.7);opacity:.7" data-fx="deny"><img src="${ui('pill-secondary', 'disabled')}" alt=""><span>${Math.round(pct * 100)}%</span></div>`}</div>`).join('')}
  </div>
  <h2>Toasts &amp; event banners</h2><p>Achievement toast slides in; event banner with scene, LIVE tag and countdown.</p>
  <div class="row" style="flex-direction:column">
    <div class="toast" id="toast"><img src="../rewards/badge_streak.svg" alt=""><div><small>ACHIEVEMENT UNLOCKED</small><b>Triple Streak</b></div></div>
    <div class="event frame"><div class="bg" style="background-image:url(../${lv.scene})"></div>
      <div class="live"><img src="../${C.tones.volcano.tag}" width="66" alt=""><b>LIVE</b></div>
      <div class="txt">${T3(lv.name, 't3')}<p>Collect ${lv.goal.count} ${lv.goal.title} before time runs out for a world chest!</p>
        <div class="plate-dark" style="width:200px"><span class="timer">⏱ <span id="cd">02d 14:08:31</span></span></div></div></div>
  </div>
  <h2>Tutorial callout</h2><p>Cream speech bubble with tail and a guide character pointing at the board.</p>
  <div style="padding:10px 0 120px 90px"><div class="callout"><div class="bub"><b>Tip!</b>Wait for the launcher to line up with a gap, then tap to fire.</div>
    <img class="tl" src="${SH('tail')}" alt=""><img class="mascot" src="../pieces/collection/critter/col_critter_0.svg" alt=""></div></div>
  <h2>Lists: settings &amp; leaderboard</h2><p>Header bar title, icon rows, live toggles; ranked rows with gold/silver/bronze and your row highlighted.</p>
  <div class="row">
    <div class="list panel" style="width:360px;padding-top:0"><div class="frame"><div class="hdr">${L3('Settings')}</div>
      ${[['icon-sound', 'Sound effects', 'on'], ['icon-music', 'Music', 'on'], ['icon-haptics', 'Haptics', 'off'], ['icon-share', 'Gentle motion', 'off']].map(([i, t, s]) =>
        `<div class="li"><img class="i" src="${ui(i)}" alt=""><span>${t}</span><img class="tg" data-s="${s}" src="${ui('toggle', s)}" alt="${t}"></div>`).join('')}</div></div>
    <div class="list lb panel" style="width:420px;padding-top:0"><div class="frame"><div class="hdr">${L3('Weekly top')}</div>
      ${[['#ffd23a', 'Nova', 48210], ['#d8dde5', 'Pixel', 44190], ['#e09a5a', 'Comet', 41020], ['#5a6070', 'You', 38450], ['#5a6070', 'Rhea', 37110]].map(([c, n, s], i) =>
        `<div class="li ${n === 'You' ? 'me' : ''}"><div class="rank" style="background:${c};color:${i < 3 ? '#3a1a00' : '#fff'}">${i + 1}</div><img class="a" src="../${lv.pieces[i % 4]}" alt=""><b style="font:900 18px var(--brand-font)">${n}</b><span style="font:800 16px Poppins;font-variant-numeric:tabular-nums">${s.toLocaleString()}</span></div>`).join('')}</div></div>
  </div>
  <h2>Banners</h2><p>Bookmark tags, starburst badges, corner ribbons, header bars, ribbons and the level-start strip (tap it).</p>
  <div class="strip">${['NEW', 'HOT', 'LV 5', 'SALE'].map((t, i) => `<div class="tagx"><img src="../${C.tones[['volcano', 'sky', 'forest', 'carnival'][i]].tag}" alt=""><b>${L3(t, '')}</b></div>`).join('')}
    ${['-50%', 'x2', 'FREE'].map(t => `<div class="offer" style="width:90px"><div class="burst" style="position:relative;left:0;top:0"><img src="../${ch.burst}" width="90" alt=""><b>${L3(t)}</b></div></div>`).join('')}
    <div class="hdr" style="width:320px;margin:0">${L3('Header bar')}</div><div class="ribbon" style="width:340px;height:84px">${L3('Ribbon banner')}</div>
    <div class="pill" style="width:260px">${L3(lv.name)}</div></div>
  <div class="lvl" id="lvl" style="margin-top:26px"><div class="band"></div>${T3('Level 7', 't3', true)}<div style="position:absolute;bottom:22px;font:700 15px Poppins">Collect ${lv.goal.count} ${lv.goal.title}</div></div>`;
  replayResults();
}
async function replayResults() {
  const st = document.querySelectorAll('#stars img'); st.forEach(s => (s.style.opacity = 0));
  for (const s of st) { await new Promise(r => setTimeout(r, 160)); s.style.opacity = 1; A.play(s, 'pop'); }
  A.countTo($('#score'), 0, 12480, 900);
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip) return setTheme(chip.dataset.t);
  const b = e.target.closest('[data-fx]');
  if (b) { const f = b.dataset.fx;
    if (f === 'deny') A.play(b, 'deny'); else A.play(b, 'jelly');
    if (f === 'claim') fx.burst(b, 26, ['#ffd65a', '#fff', '#7ff3ff']);
    if (f === 'replay') replayResults(); }
  const tg = e.target.closest('.tg'); if (tg) { tg.dataset.s = tg.dataset.s === 'on' ? 'off' : 'on'; tg.src = `../buttons/${theme}/ui_${theme}_toggle_${tg.dataset.s}.svg`; A.play(tg, 'pop'); }
  const lvl = e.target.closest('#lvl'); if (lvl) { lvl.classList.remove('anim'); void lvl.offsetWidth; lvl.classList.add('anim'); }
  const t = e.target.closest('#toast'); if (t) A.popIn(t);
});
setInterval(() => { const c = $('#cd'); if (!c) return; const [d, rest] = c.textContent.split('d '), [h, m, s] = rest.split(':').map(Number);
  let x = ((+d * 24 + h) * 60 + m) * 60 + s - 1; const dd = Math.floor(x / 86400); x %= 86400;
  c.textContent = `${String(dd).padStart(2, '0')}d ${[Math.floor(x / 3600), Math.floor(x % 3600 / 60), x % 60].map(v => String(v).padStart(2, '0')).join(':')}`; }, 1000);
function setTheme(t) { theme = t; localStorage.setItem('edgepulse.theme', t); render(); }
addEventListener('message', e => { if (e.data?.type === 'theme' && K.themes[e.data.theme]) setTheme(e.data.theme); });
render();
</script></body></html>
